[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ohsh"
description = "Resolve HDL module manifests into ordered, per-library source lists and a library compile order."
dynamic = ["version"]
authors = [
    { name = "Ola Groettvik" },
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
keywords = ["hdl", "verilog", "vhdl", "systemverilog", "fpga", "eda", "dependency", "manifest", "hog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/logvik-org/oshsh"
Repository = "https://github.com/logvik-org/oshsh"
Issues = "https://github.com/logvik-org/oshsh/issues"
Changelog = "https://github.com/logvik-org/oshsh/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff==0.16.9",
    "build>=1.0",
    "twine>=5.0",
    "pre-commit>=3.0",
]
# Python frameworks used by the integration examples, pinned to the versions CI
# runs them with.
examples = [
    "cocotb==2.1.0",
    "vunit-hdl==4.7.1",
]

[project.scripts]
ohsh = "ohsh.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ohsh.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ohsh*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.report]
fail_under = 90
