# setuptools 77 needs Python 3.9, so building or installing from source does
# too. Older Pythons install the wheel, which has no such limit.
[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ohsh"
description = "Resolve HDL module manifests into ordered, per-library source lists and a library compile order."
dynamic = ["version"]
authors = [
    { name = "Ola Groettvik" },
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.6"
keywords = ["hdl", "verilog", "vhdl", "systemverilog", "fpga", "eda", "dependency", "manifest", "hog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/logvik-org/ohsh"
Documentation = "https://ohsh.readthedocs.io"
Repository = "https://github.com/logvik-org/ohsh"
Issues = "https://github.com/logvik-org/ohsh/issues"
Changelog = "https://github.com/logvik-org/ohsh/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Kept apart from dev, whose release and lint tools need a newer Python than
# the oldest one the tests run on.
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev = [
    "ohsh[test]",
    "build>=1.0",
    "twine>=5.0",
    "pre-commit>=3.0",
]
# Python frameworks used by the integration examples, pinned to the versions CI
# runs them with.
examples = [
    "cocotb==2.1.0",
    "vunit-hdl==4.7.1",
]
docs = [
    "sphinx>=7.4",
    "myst-parser>=3.0",
    "furo>=2024.8",
]

[project.scripts]
ohsh = "ohsh.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ohsh.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ohsh*"]

[tool.setuptools.package-data]
ohsh = ["py.typed"]

[tool.ruff]
line-length = 100
# The oldest version ruff can target. ohsh supports 3.6, which only the CI test
# jobs check.
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# UP021 and UP022 rewrite subprocess calls to arguments that Python 3.6 lacks.
ignore = ["E501", "UP021", "UP022"]

[tool.mypy]
files = ["ohsh"]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.report]
fail_under = 90
