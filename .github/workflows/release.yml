name: Release

# Publishing a GitHub Release runs one chain, each job waiting for the previous:
# tests -> build -> TestPyPI -> install from TestPyPI and smoke-test -> PyPI.
# PyPI receives the exact files that were verified on TestPyPI.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  integrations:
    uses: ./.github/workflows/integration.yml

  build:
    needs: [ci, integrations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version="$(python -c 'import ohsh; print(ohsh.__version__)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match ohsh.__version__ ($version)"
            exit 1
          fi
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/*

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # OIDC for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # Lets a failed release be re-run after TestPyPI already has the files.
          skip-existing: true

  verify-testpypi:
    needs: testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install from TestPyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A new upload can take a few minutes to show up in the index.
          for attempt in $(seq 10); do
            if pip install --no-cache-dir --index-url https://test.pypi.org/simple/ "ohsh==$version"; then
              exit 0
            fi
            echo "Attempt $attempt: ohsh $version not installable yet, retrying in 30 s"
            sleep 30
          done
          echo "::error::ohsh $version never became installable from TestPyPI"
          exit 1
      - name: Smoke-test the TestPyPI package
        run: scripts/smoke-test.sh "${GITHUB_REF_NAME#v}"

  pypi:
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
