name: Integrations

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

# Tool versions are pinned so CI only changes when we bump them on purpose.
jobs:
  examples:
    runs-on: ubuntu-24.04
    defaults:
      run:
        # An explicit bash shell runs with pipefail, so a failing example is not
        # hidden by the `| tee` used to check its output for deprecations.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ohsh + Python sim frameworks
        run: pip install ".[examples]"

      - name: Install Icarus Verilog and tcllib
        run: sudo apt-get update && sudo apt-get install -y iverilog tcllib

      - name: Install GHDL
        uses: ghdl/setup-ghdl@75eff367dadc0cd06454a118db0b458d44fdc3c3  # v1.5.1
        with:
          version: 6.0.0

      - name: Install NVC
        uses: nickg/setup-nvc@48f966dfc9b27bf13e873a473fcf1649ef8f5a0f  # v1
        with:
          version: 1.23.0

      - name: cocotb Makefile (simple)
        working-directory: examples/integrations/cocotb_makefile/simple
        run: |
          make 2>&1 | tee "$RUNNER_TEMP/output.log"
          ! grep -iE "DeprecationWarning|is deprecated" "$RUNNER_TEMP/output.log"

      - name: cocotb Makefile (advanced)
        working-directory: examples/integrations/cocotb_makefile/advanced
        run: |
          make 2>&1 | tee "$RUNNER_TEMP/output.log"
          ! grep -iE "DeprecationWarning|is deprecated" "$RUNNER_TEMP/output.log"

      - name: cocotb runner (simple)
        working-directory: examples/integrations/cocotb_runner/simple
        run: |
          python runner.py 2>&1 | tee "$RUNNER_TEMP/output.log"
          ! grep -iE "DeprecationWarning|is deprecated" "$RUNNER_TEMP/output.log"

      - name: cocotb runner (advanced)
        working-directory: examples/integrations/cocotb_runner/advanced
        run: |
          python runner.py 2>&1 | tee "$RUNNER_TEMP/output.log"
          ! grep -iE "DeprecationWarning|is deprecated" "$RUNNER_TEMP/output.log"

      - name: VUnit (simple)
        working-directory: examples/integrations/vunit/simple
        env:
          VUNIT_SIMULATOR: ghdl
        run: |
          python run.py 2>&1 | tee "$RUNNER_TEMP/output.log"
          ! grep -iE "DeprecationWarning|is deprecated" "$RUNNER_TEMP/output.log"

      - name: VUnit (advanced)
        working-directory: examples/integrations/vunit/advanced
        env:
          VUNIT_SIMULATOR: ghdl
        run: |
          python run.py 2>&1 | tee "$RUNNER_TEMP/output.log"
          ! grep -iE "DeprecationWarning|is deprecated" "$RUNNER_TEMP/output.log"

      - name: GHDL (simple)
        run: bash examples/integrations/ghdl/simple/run.sh

      - name: GHDL (advanced)
        run: bash examples/integrations/ghdl/advanced/run.sh

      - name: NVC (simple)
        run: bash examples/integrations/nvc/simple/run.sh

      - name: NVC (advanced)
        run: bash examples/integrations/nvc/advanced/run.sh

      - name: UVVM (simple)
        run: bash examples/integrations/uvvm/simple/run.sh

      - name: UVVM (advanced)
        run: bash examples/integrations/uvvm/advanced/run.sh

      - name: hog (simple)
        run: bash examples/integrations/hog/simple/run.sh

      - name: hog (advanced)
        run: bash examples/integrations/hog/advanced/run.sh
