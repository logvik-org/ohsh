name: Integrations

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

# Tool versions are pinned so CI only changes when we bump them on purpose.
jobs:
  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ohsh + Python sim frameworks
        run: pip install . cocotb==2.1.0 vunit-hdl==4.7.1

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install GHDL
        uses: ghdl/setup-ghdl@75eff367dadc0cd06454a118db0b458d44fdc3c3  # v1.5.1
        with:
          version: 6.0.0

      - name: Install NVC
        uses: nickg/setup-nvc@48f966dfc9b27bf13e873a473fcf1649ef8f5a0f  # v1
        with:
          version: 1.23.0

      - name: cocotb (Makefile flow)
        working-directory: examples/integrations/cocotb_makefile
        run: make

      - name: cocotb (Python runner)
        working-directory: examples/integrations/cocotb_runner
        run: python runner.py

      - name: VUnit
        working-directory: examples/integrations/vunit
        env:
          VUNIT_SIMULATOR: ghdl
        run: python run.py

      - name: GHDL
        run: bash examples/integrations/ghdl/run.sh

      - name: NVC
        run: bash examples/integrations/nvc/run.sh

      - name: UVVM (GHDL)
        run: bash examples/integrations/uvvm/run.sh
