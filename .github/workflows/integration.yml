name: Integrations

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

# Tool versions are pinned so CI only changes when we bump them on purpose.
jobs:
  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ohsh + Python sim frameworks
        run: pip install ".[examples]"

      - name: Install Icarus Verilog and tcllib
        run: sudo apt-get update && sudo apt-get install -y iverilog tcllib

      - name: Install GHDL
        uses: ghdl/setup-ghdl@75eff367dadc0cd06454a118db0b458d44fdc3c3  # v1.5.1
        with:
          version: 6.0.0

      - name: Install NVC
        uses: nickg/setup-nvc@48f966dfc9b27bf13e873a473fcf1649ef8f5a0f  # v1
        with:
          version: 1.23.0

      - name: Run the examples
        run: scripts/run-examples.sh
